name: Commit Stage
on: push

env:
  REGISTRY: ghcr.io
  USER_NAME: mahmoud-saad92
  IMAGE_NAME: order-service
  VERSION: 0.0.1

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with: {
          java-version: '21',
          distribution: 'temurin',
          cache: 'maven'
        }
      - name: Build, Run unit tests and skip integration tests
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipITs=true
      - name: Build, Run integration tests and skip unit tests
        run: |
          chmod +x mvnw
          ./mvnw verify -DskipUTs=true
      - name: Code vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          path: "${{ github.workspace }}"
          fail-build: 'false'
          severity-cutoff: 'high'
      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: "${{ steps.scan.outputs.sarif }}"
      - name: Setup tools
        uses: alexellis/setup-arkade@v3
      - name: Install tools
        uses: alexellis/arkade-get@master
        with:
          kubeconform: latest
      - name: Validate Kubernetes manifests
        run: |
          kubeconform --strict k8s

services:
  app:
    container_name: order-service
    image: order-service:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${CONTAINER_PORT}
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOSTNAME: ${POSTGRES_HOSTNAME}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      POSTGRES_CONNECTION_POOL_INITIAL_SIZE: ${POSTGRES_CONNECTION_POOL_INITIAL_SIZE}
      POSTGRES_CONNECTION_POOL_MAX_SIZE: ${POSTGRES_CONNECTION_POOL_MAX_SIZE}
      POSTGRES_CONNECTION_POOL_MAX_CREATE_CONNECTION_TIME: ${POSTGRES_CONNECTION_POOL_MAX_CREATE_CONNECTION_TIME}
    networks:
      polar-nw:
        aliases:
          - 'order-service'
      postgres:
        aliases:
          - 'order-service'

networks:
  polar-nw:
    name: polar-nw
    external: true
  postgres:
    name: polar-postgres-nw
    external: true